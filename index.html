<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba & Milkshake Finder</title>
    <!-- PyScript CSS & JS CDN links -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body {
            background-color: #fff0f5; /* Soft pastel pink background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #5a4a42;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            width: 420px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            border: 4px solid #fffacd; /* Pastel yellow border */
            position: relative;
        }

        /* Whipped cream decorative header effect */
        .whipped-cream-top {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffe0; /* Pastel yellow cream */
            color: #d87093;
            padding: 6px 20px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            border: 3px solid #ffb6c1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            letter-spacing: 1px;
        }

        h1 {
            color: #ff69b4;
            text-align: center;
            font-size: 24px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .instructions {
            background-color: #fffacd; /* Pastel yellow instructions box */
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            color: #7a6e65;
            border-left: 5px solid #ffb6c1;
        }

        label {
            font-weight: bold;
            color: #d87093;
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background-color: #fff9fb;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            border-color: #ff69b4;
        }

        button {
            width: 100%;
            background-color: #ffb6c1; /* Pastel pink button */
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.5);
        }

        button:hover {
            background-color: #ff69b4;
        }

        #result {
            margin-top: 20px;
            background-color: #fff9fb;
            border: 2px dashed #ffb6c1;
            padding: 15px;
            border-radius: 12px;
            min-height: 70px;
            color: #5a4a42;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Whipped cream decorative topper -->
        <div class="whipped-cream-top">Enjoy your Drink!</div>

        <h1>Boba & Milkshake Finder</h1>
        
        <div class="instructions">
            <b>Instructions:</b><br>
            Enter the name of a boba or milkshake (Example: <b>Brown Sugar Boba</b>, <b>Oreo Cheesecake Shake</b>, <b>Mango Smoothie</b>).
        </div>

        <label for="element_Name">Drink Code:</label>
        <input type="text" id="element_Name" placeholder="e.g. Brown Sugar Boba">
        
        <button py-click="element_checker"> 👀 Check Details 👀 </button>
        
        <div id="result">
            <em>Result details will appear here... 😋</em>
        </div>
    </div>

    <!-- Link your Python script -->
    <script type="py" src="main.py"></script>
</body>
</html>
